version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/java"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directories:
      - "/csharp/*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "bundler"
    directory: "/ruby"
    schedule:
      interval: "weekly"
